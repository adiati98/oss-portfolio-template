name: Update Contributions

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Type of sync to perform'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - full

jobs:
  run_scheduled_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: demo
          fetch-depth: 0 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Conditionally run full sync or daily update
        run: |
          # Use the input signal sent from the main branch trigger
          if [ "${{ github.event.inputs.sync_mode }}" = "full" ]; then
            echo "Security Check: Full sync requested. Purging cache..."
            rm -f data/all-contributions.json
            rm -f data/commit-cache.json
            rm -f data/pr-cache.json
            node scripts/src/main.js
          else
            echo "Running standard daily incremental update..."
            node scripts/src/main.js
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format generated files
        run: npm run format
        
      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add contributions/markdown-generated/ contributions/html-generated/ data/
          
          if ! git diff --staged --quiet; then
            if [ "${{ github.event.inputs.sync_mode }}" = "full" ]; then
                git commit -m "docs: Monthly full sync [skip ci]"
            else
                git commit -m "docs: Daily contributions update [skip ci]"
            fi
            git push origin demo
            echo "pushed=true" >> $GITHUB_OUTPUT 
          else
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Netlify Deployment
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -s -X POST -d {} ${NETLIFY_BUILD_HOOK} -o /dev/null
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}