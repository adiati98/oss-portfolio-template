name: Demo Branch Auto-Trigger

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  trigger-demo:
    if: github.repository == 'adiati98/oss-portfolio-template'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Demo Branch
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.TRIGGER_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-contributions.yml/dispatches \
          -d '{"ref":"demo"}'