name: Demo Branch Auto-Trigger

on:
  schedule:
    # Daily signal at 01:30 UTC
    - cron: '30 1 * * *'
    # Monthly signal at 01:05 UTC on the 1st
    - cron: '5 1 1 * *'
  workflow_dispatch:

jobs:
  trigger-demo:
    if: github.repository == 'adiati98/oss-portfolio-template'
    runs-on: ubuntu-latest
    steps:
      - name: Determine Sync Mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "5 1 1 * *" ]; then
            echo "sync_mode=full" >> $GITHUB_OUTPUT
          else
            echo "sync_mode=daily" >> $GITHUB_OUTPUT
          fi

      - name: Secure API Signal to Demo Branch
        env:
          GH_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          SYNC_MODE: ${{ steps.mode.outputs.sync_mode }}
          REPO: ${{ github.repository }}
        run: |
          curl -L -X POST -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/$REPO/actions/workflows/update-contributions.yml/dispatches" \
          -d "{\"ref\":\"demo\", \"inputs\": {\"sync_mode\": \"$SYNC_MODE\"}}"